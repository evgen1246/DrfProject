services:
  db:
    image: postgres:16-alpine
    container_name: drfproject_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [drfproject_network]

  redis:
    image: redis:7-alpine
    container_name: drfproject_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [drfproject_network]

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: drfproject_web
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [drfproject_network]

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: drfproject_celery_worker
    restart: always
    command: celery -A config worker -l info
    env_file: .env
    environment:
      HOST: db
      REDIS_HOST: redis
    volumes:
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [drfproject_network]

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: drfproject_celery_beat
    restart: always
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      HOST: db
      REDIS_HOST: redis
    volumes:
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      celery_worker: {condition: service_started}
    networks: [drfproject_network]

  nginx:
    image: nginx:1.27-alpine
    container_name: drfproject_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    networks: [drfproject_network]

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  drfproject_network:
    driver: bridge