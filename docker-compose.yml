version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: drfproject_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drfproject_network

  redis:
    image: redis:7-alpine
    container_name: drfproject_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drfproject_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drfproject_web
    restart: unless-stopped
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drfproject_network

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drfproject_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info -P solo
    env_file:
      - .env
    environment:
      HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - drfproject_network

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drfproject_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    networks:
      - drfproject_network

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:

networks:
  drfproject_network:
    driver: bridge

